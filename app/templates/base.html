<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Volume App</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="/">Case Volume App</a>
      <div class="navbar-nav ml-auto">
        {% if current_user.is_authenticated %}
          <span class="navbar-text mr-3">Welcome, {{ current_user.username }} ({{ current_user.department.name }})</span>
          <a class="nav-link" href="/my-cases">My Cases</a>
          <a class="nav-link" href="{{ url_for('main.logout') }}">Logout</a>
        {% endif %}
      </div>
    </nav>
    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
