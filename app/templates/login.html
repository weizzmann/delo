{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center">Login</h2>
        <form id="loginForm" class="card p-4">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p id="message" class="text-center mt-3"></p>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        var username = $('#username').val();
        var password = $('#password').val();
        $.ajax({
            url: '/auth/login',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ username: username, password: password }),
            success: function(data) {
                console.log('Login success:', data);
                $('#message').text('Logged in successfully').css('color', 'green');
                setTimeout(function() { window.location.href = '/'; }, 1000);
            },
            error: function(xhr) {
                console.log('Login error:', xhr.responseText);
                $('#message').text('Login failed: ' + (xhr.responseJSON ? xhr.responseJSON.error : 'Unknown error')).css('color', 'red');
            }
        });
    });
});
</script>
{% endblock %}
